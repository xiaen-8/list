name: 📺 Update WeTV Library

on:
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: 📦 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp
      - name: 🚀 运行抓取脚本
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python scripts/update_wetv.py
      - name: 📤 提交并推送到 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/wetv.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自动更新腾讯WeTV数据 📺" && git pull --rebase origin main && git push)
